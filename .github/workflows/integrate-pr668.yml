name: Integrate Root-My-Galaxy PR 668

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate-pr668-run
          fetch-depth: 0

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Prepare NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Merge #668 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE_REPO="https://github.com/rushiranpise/Root-My-Galaxy-Next.git"
          SOURCE_REF="pr"
          BASE_SHA="23adf39fcd4f1be4e73184ee960a6d5399baf147"

          git remote add rmg668 "$SOURCE_REPO"
          git fetch --no-tags rmg668 "$SOURCE_REF"
          SOURCE_SHA="$(git rev-parse FETCH_HEAD)"

          OVERLAP=(
            ".github/workflows/ci.yml"
            ".github/workflows/release.yml"
            "README.md"
            "app/build.gradle.kts"
            "app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt"
            "app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt"
            "app/src/main/java/dev/busung/s25uroot/SupportManifest.kt"
            "app/src/main/res/values/strings.xml"
            "app/src/test/java/dev/busung/s25uroot/TargetProfileTest.kt"
          )

          mkdir -p "$RUNNER_TEMP/rmg-ours" "$RUNNER_TEMP/rmg-base" "$RUNNER_TEMP/rmg-theirs"

          safe_name() {
            printf '%s' "$1" | tr '/.' '__'
          }

          for path in "${OVERLAP[@]}"; do
            safe="$(safe_name "$path")"
            git show "HEAD:$path" > "$RUNNER_TEMP/rmg-ours/$safe"
            git show "$BASE_SHA:$path" > "$RUNNER_TEMP/rmg-base/$safe"
            git show "$SOURCE_SHA:$path" > "$RUNNER_TEMP/rmg-theirs/$safe"
          done

          git merge --no-commit --no-ff "$SOURCE_SHA" || true

          # Resolve the nine files that exist on both lines.
          # For application/build logic, use a three-way merge that keeps our live S721B/forensic/offline
          # changes when the same hunk conflicts, while still importing non-conflicting #668 changes.
          # README/CI/release are infrastructure-only; use the #668 version there.
          for path in "${OVERLAP[@]}"; do
            safe="$(safe_name "$path")"
            ours="$RUNNER_TEMP/rmg-ours/$safe"
            base="$RUNNER_TEMP/rmg-base/$safe"
            theirs="$RUNNER_TEMP/rmg-theirs/$safe"

            case "$path" in
              ".github/workflows/"*|"README.md")
                git checkout --theirs -- "$path" 2>/dev/null || cp "$theirs" "$path"
                ;;
              *)
                git merge-file --ours -p "$ours" "$base" "$theirs" > "$path"
                ;;
            esac
          done

          # Do not let the cross-process run tracker block the exploit itself.
          # It remains available for observability/cleanup, but an existing record from another process
          # is no longer a hard refusal before the exploit starts.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/dev/busung/s25uroot/InstallViewModel.kt")
          lines = path.read_text(encoding="utf-8").splitlines()
          needle = "        runInFlightElsewhere()?.let { other ->"
          start = next((i for i, line in enumerate(lines) if line == needle), None)

          if start is not None:
              depth = 0
              end = None
              for i in range(start, len(lines)):
                  depth += lines[i].count("{")
                  depth -= lines[i].count("}")
                  if i > start and depth == 0:
                      end = i
                      break
              if end is None:
                  raise SystemExit("Could not locate the full runInFlight guard block")
              replacement = [
                  "        runInFlightElsewhere()?.let { other ->",
                  "            AppLog.debug(",
                  "                RUN_LOG_TAG,",
                  "                \"Another process has a run in flight (pid ${other.pid}, entry ${other.entryId}); continuing this exploit attempt.\",",
                  "            )",
                  "        }",
              ]
              lines[start:end + 1] = replacement
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          else:
              print("Run-in-flight exploit guard already absent; nothing to remove.")
          PY

          # The temporary workflow must not become part of the product branch.
          rm -f .github/workflows/integrate-pr668.yml

          # If merge left an unmerged index, the file-level resolutions above should have cleared it.
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit after integration."
          else
            git commit -m "feat: integrate Root-My-Galaxy #668 into live S721B fork"
          fi

          git branch -f integrated-pr668-ready HEAD
          git push origin "HEAD:refs/heads/integrated-pr668-ready" --force

      - name: Build and test integrated branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integrated-pr668-ready
          git checkout --force integrated-pr668-ready
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify integration commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Integrated SHA: $(git rev-parse HEAD)"
          git status --short
