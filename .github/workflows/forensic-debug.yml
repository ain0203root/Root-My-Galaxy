name: forensic-release

on:
  push:
    branches: [forensic-trace]
  workflow_dispatch:

jobs:
  build-forensic-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.13004108"
      - name: Apply forensic instrumentation
        run: python3 tools/forensic/apply_forensic_trace.py tools/forensic/ForensicTrace.kt
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-release
          path: app/build/outputs/apk/release/*.apk
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-release-metadata
          path: |
            app/build/outputs/mapping/release/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
