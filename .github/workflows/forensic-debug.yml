name: forensic-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-forensic-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.13004108"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Apply forensic instrumentation
        run: python3 tools/forensic/apply_forensic_trace.py tools/forensic/ForensicTrace.kt

      - name: Create build signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/rmg-forensic.jks" \
            -storetype JKS \
            -storepass 'rmg-forensic' \
            -keypass 'rmg-forensic' \
            -alias rmg-forensic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname 'CN=Root My Galaxy Forensic, O=ain0203root, C=DE'
          {
            echo "RMG_KEYSTORE_PATH=${RUNNER_TEMP}/rmg-forensic.jks"
            echo "RMG_KEYSTORE_PASSWORD=rmg-forensic"
            echo "RMG_KEY_ALIAS=rmg-forensic"
            echo "RMG_KEY_PASSWORD=rmg-forensic"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee root-my-galaxy-forensic-release.sha256
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee root-my-galaxy-forensic-release-certs.txt

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-installable
          path: |
            app/build/outputs/apk/release/app-release.apk
            root-my-galaxy-forensic-release.sha256
            root-my-galaxy-forensic-release-certs.txt
          if-no-files-found: error
          retention-days: 30
