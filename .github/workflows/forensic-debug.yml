name: forensic-release

on:
  push:
    branches: [forensic-trace]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: forensic-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-forensic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/20.0/bin/sdkmanager"
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          "${SDKMANAGER}" --update || true
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=1 "platform-tools" "platforms;android-37" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.13004108"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Apply forensic instrumentation
        run: python3 tools/forensic/apply_forensic_trace.py tools/forensic/ForensicTrace.kt
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee app-release-unsigned.sha256
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app-release-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
            app/build/outputs/mapping/release/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
