name: forensic-debug

on:
  workflow_dispatch:

jobs:
  build-forensic-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.13004108"
      - name: Apply forensic instrumentation
        run: python3 tools/forensic/apply_forensic_trace.py tools/forensic/ForensicTrace.kt
      - name: Build diagnostic APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
