name: forensic-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  RMG_FORENSIC_BUILD: "true"

concurrency:
  group: forensic-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-forensic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/20.0/bin/sdkmanager"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.13004108"

          PLATFORM_DIR="${ANDROID_HOME}/platforms/android-37.0"
          PLATFORM_ZIP="${RUNNER_TEMP}/platform-37.0_r02.zip"
          rm -rf "${PLATFORM_DIR}"
          mkdir -p "${PLATFORM_DIR}"
          curl --fail --location --retry 3 --retry-delay 2 \
            -o "${PLATFORM_ZIP}" \
            "https://dl.google.com/android/repository/platform-37.0_r02.zip"
          echo "ed8ebf7f8822a4de5686d427f237d2fa30ff7410  ${PLATFORM_ZIP}" | sha1sum -c -
          unzip -q "${PLATFORM_ZIP}" -d "${RUNNER_TEMP}/android-platform-37"
          test -d "${RUNNER_TEMP}/android-platform-37/android-37.0"
          cp -a "${RUNNER_TEMP}/android-platform-37/android-37.0/." "${PLATFORM_DIR}/"
          test -f "${PLATFORM_DIR}/android.jar"
          printf 'Pkg.Desc=Android SDK Platform 37.0\nPkg.Path=platforms;android-37.0\nPkg.Revision=2\nAndroidVersion.ApiLevel=37\n' \
            > "${PLATFORM_DIR}/source.properties"

      - name: Build forensic payload from the user's Payloads repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/Root-My-Galaxy-Payloads"
          git clone --depth 1 --branch forensic-trace \
            https://github.com/ain0203root/Root-My-Galaxy-Payloads.git \
            "${RUNNER_TEMP}/Root-My-Galaxy-Payloads"
          cd "${RUNNER_TEMP}/Root-My-Galaxy-Payloads"
          PAYLOAD_COMMIT="$(git rev-parse HEAD)"
          echo "RMG_FORENSIC_PAYLOAD_SOURCE=${PAYLOAD_COMMIT}" >> "$GITHUB_ENV"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.0.13004108"
          make TARGET="r12s-S721BXXSCDZF3" ANDROID_NDK_HOME="$ANDROID_NDK_HOME" forensic
          test -s "build/r12s-S721BXXSCDZF3/cve-2026-43499-app.forensic.so"
          strings "build/r12s-S721BXXSCDZF3/cve-2026-43499-app.forensic.so" | grep -Eq '\[FT-CMP\]|\[FT-PC\]'
          mkdir -p "${GITHUB_WORKSPACE}/app/src/main/assets/forensic"
          cp "build/r12s-S721BXXSCDZF3/cve-2026-43499-app.forensic.so" \
            "${GITHUB_WORKSPACE}/app/src/main/assets/forensic/cve-2026-43499-app.so"
          printf 'payload_repo=ain0203root/Root-My-Galaxy-Payloads\npayload_branch=forensic-trace\npayload_commit=%s\ntarget=r12s-S721BXXSCDZF3\nartifact=cve-2026-43499-app.forensic.so\n' \
            "$PAYLOAD_COMMIT" > "${GITHUB_WORKSPACE}/app/src/main/assets/forensic/payload-source.txt"
          sha256sum "build/r12s-S721BXXSCDZF3/cve-2026-43499-app.forensic.so" \
            > "${GITHUB_WORKSPACE}/app/src/main/assets/forensic/payload-sha256.txt"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Apply forensic instrumentation
        run: python3 tools/forensic/apply_forensic_trace.py tools/forensic/ForensicTrace.kt

      - name: Create build signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/rmg-forensic.jks" \
            -storetype JKS \
            -storepass 'rmg-forensic' \
            -keypass 'rmg-forensic' \
            -alias rmg-forensic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname 'CN=Root My Galaxy Forensic, O=ain0203root, C=DE'
          {
            echo "RMG_KEYSTORE_PATH=${RUNNER_TEMP}/rmg-forensic.jks"
            echo "RMG_KEYSTORE_PASSWORD=rmg-forensic"
            echo "RMG_KEY_ALIAS=rmg-forensic"
            echo "RMG_KEY_PASSWORD=rmg-forensic"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK and embedded forensic payload
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test -s "app/src/main/assets/forensic/cve-2026-43499-app.so"
          unzip -l "$APK" | grep -F 'assets/forensic/cve-2026-43499-app.so'
          unzip -p "$APK" 'assets/forensic/cve-2026-43499-app.so' > "${RUNNER_TEMP}/embedded-forensic.so"
          cmp "${RUNNER_TEMP}/embedded-forensic.so" "app/src/main/assets/forensic/cve-2026-43499-app.so"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee root-my-galaxy-forensic-release.sha256
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee root-my-galaxy-forensic-release-certs.txt
          sha256sum "app/src/main/assets/forensic/cve-2026-43499-app.so" | tee root-my-galaxy-forensic-payload.sha256

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-installable
          path: |
            app/build/outputs/apk/release/app-release.apk
            root-my-galaxy-forensic-release.sha256
            root-my-galaxy-forensic-release-certs.txt
            root-my-galaxy-forensic-payload.sha256
            app/src/main/assets/forensic/payload-source.txt
          if-no-files-found: error
          retention-days: 30
