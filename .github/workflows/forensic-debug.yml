name: forensic-release

on:
  push:
    branches: [forensic-trace]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true

concurrency:
  group: forensic-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-forensic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.13004108"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Apply forensic instrumentation
        run: python3 tools/forensic/apply_forensic_trace.py tools/forensic/ForensicTrace.kt
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee app-release-unsigned.sha256
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app-release-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-forensic-release-metadata
          path: |
            app/build/outputs/mapping/release/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
