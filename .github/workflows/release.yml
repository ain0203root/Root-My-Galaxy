name: Experimental Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build current source and publish experimental APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          SHORT_SHA="\${GITHUB_SHA:0:7}"
          TAG_NAME="v\${VERSION_NAME}-s24fe-\${SHORT_SHA}"
          APK="Root-My-Galaxy-\${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-\${APK}"
          sha256sum "release-\${APK}" | tee "release-\${APK}.sha256"
          echo "TAG_NAME=\${TAG_NAME}" >> "\${GITHUB_ENV}"
          echo "APK=release-\${APK}" >> "\${GITHUB_ENV}"
          echo "SHA=release-\${APK}.sha256" >> "\${GITHUB_ENV}"

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "\${ANDROID_HOME}/build-tools" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$APK"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            release-\${APK#release-}
            \${SHA}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub release
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
## Root My Galaxy — Experimental S24 FE build

Built from commit \${GITHUB_SHA} on ref \${GITHUB_REF_NAME}.

This is an experimental engineering build. Results may vary by device, firmware, execution context, payload state, and kernel memory layout.

Use only on devices you own or are explicitly authorized to test.

SHA-256:
\`\`\`
$(cat "\${SHA}")
\`\`\`
EOF
)"
          if gh release view "\${TAG_NAME}" --repo "\${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "\${TAG_NAME}" --repo "\${GITHUB_REPOSITORY}" \
              --title "Root My Galaxy · Experimental · \${TAG_NAME}" \
              --notes "\${NOTES}" \
              --prerelease
            gh release upload "\${TAG_NAME}" "\${APK}" "\${SHA}" \
              --repo "\${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "\${TAG_NAME}" "\${APK}" "\${SHA}" \
              --repo "\${GITHUB_REPOSITORY}" \
              --title "Root My Galaxy · Experimental · \${TAG_NAME}" \
              --notes "\${NOTES}" \
              --prerelease
          fi
