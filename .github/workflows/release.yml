name: Release Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, or leave blank to use the latest v* tag
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-existing-s24fe-artifact:
    if: github.event_name == 'push' && github.sha == 'f064f7115d61194074c904eb60bb98746f3d2f7f'
    name: Publish existing S24 FE CI artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download existing CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o artifact.zip \
            "https://api.github.com/repos/ain0203root/Root-My-Galaxy/actions/artifacts/10044817565/zip"
          mkdir artifact
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name '*.apk' -print -quit)"
          SHA="$(find artifact -type f -name '*.sha256' -print -quit)"
          test -s "$APK"
          test -s "$SHA"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Create experimental GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="s24fe-june-s721bxxsddzg1-experimental"
          cat > release-notes.md <<'EOF'
## Extremely Experimental Samsung Galaxy S24 FE Profile

This is an **extremely experimental** build for the **Samsung Galaxy S24 FE** using the June firmware profile.

**Firmware:** `S721BXXSDDZG1`

This profile is **not reliable and does not work every time**. Successful exploitation/root acquisition is not guaranteed. Expect failures and use this build strictly for testing.

The APK is taken directly from the existing GitHub Actions CI artifact from run `34198115865` and has not been rebuilt for this release.
EOF
          gh release create "$TAG" "$APK" "$SHA" \
            --repo ain0203root/Root-My-Galaxy \
            --title "Experimental S24 FE — S721BXXSDDZG1 (June Profile)" \
            --notes-file release-notes.md \
            --prerelease

  build:
    name: Release Build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          VERSION_NAME="$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          EXPECTED_TAG="v$VERSION_NAME"
          if [ -n "$INPUT_TAG_NAME" ]; then TAG_NAME="$INPUT_TAG_NAME"; else TAG_NAME="$EXPECTED_TAG"; fi
          if [ -z "$TAG_NAME" ]; then echo "No release tag found." >&2; exit 1; fi
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then echo "Tag $TAG_NAME does not match app version $VERSION_NAME (expected $EXPECTED_TAG)." >&2; exit 1; fi
          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then git tag -a "$TAG_NAME" -m "Release $TAG_NAME"; git push origin "refs/tags/$TAG_NAME"; fi
          TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)"
          { echo "tag_name=$TAG_NAME"; echo "version_name=$VERSION_NAME"; echo "tag_commit=$TAG_COMMIT"; echo "previous_tag=$PREVIOUS_TAG"; } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: git checkout --force "$TAG_NAME"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate release notes
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_tag.outputs.version_name }}
          TAG_COMMIT: ${{ steps.release_tag.outputs.tag_commit }}
          PREVIOUS_TAG: ${{ steps.release_tag.outputs.previous_tag }}
        run: |
          set -euo pipefail
          {
            echo "# Release $TAG_NAME"
            echo
            echo "Version: $VERSION_NAME"
            echo "Commit: $TAG_COMMIT"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then echo "Changes since $PREVIOUS_TAG:"; echo; git log --format='- %s' "$PREVIOUS_TAG..$TAG_NAME"; else echo "First tagged release."; fi
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Release $TAG_NAME" --notes-file release-notes.md --latest
            gh release upload "$TAG_NAME" app/build/outputs/apk/debug/*.apk --clobber
          else
            gh release create "$TAG_NAME" app/build/outputs/apk/debug/*.apk --title "Release $TAG_NAME" --notes-file release-notes.md --latest
          fi
